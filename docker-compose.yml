services:
  app:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-knowledge_copilot}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-knowledge_copilot}
      QDRANT_URL: http://qdrant:6333
      UPLOAD_DIRECTORY: /app/data/uploads
      EMBEDDING_CACHE_DIRECTORY: /app/data/model_cache
      RERANKER_CACHE_DIRECTORY: /app/data/model_cache
      HF_HOME: /app/data/model_cache
      MIGRATION_MAX_ATTEMPTS: ${MIGRATION_MAX_ATTEMPTS:-10}
      MIGRATION_RETRY_SECONDS: ${MIGRATION_RETRY_SECONDS:-2}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - "${DOCKER_UPLOAD_PATH:-./data/runtime/uploads}:/app/data/uploads"
      - "${DOCKER_MODEL_CACHE_PATH:-./data/model_cache}:/app/data/model_cache"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - "${POSTGRES_DATA_PATH:-./data/runtime/postgres}:/var/lib/postgresql/data"
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-knowledge_copilot} -d ${POSTGRES_DB:-knowledge_copilot}"
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.13.2}
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - "${QDRANT_DATA_PATH:-./data/runtime/qdrant}:/qdrant/storage"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "</dev/tcp/127.0.0.1/6333"
      interval: 5s
      timeout: 3s
      retries: 10
